
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klickolaus – Det magiske julespillet</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --gold: #ffd700;
  --red: #c62828;
  --green: #146b3a;
  --dark: #071912;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 65px 12px 65px;
  font-family: 'Segoe UI', sans-serif;
  color: white;
  text-align: center;
  overflow-x: hidden;

  background:
    radial-gradient(ellipse at 50% 0%, #28543c 0%, transparent 48%),
    radial-gradient(ellipse at bottom, #143d28 0%, #06150f 75%);
}

/* JULELYS */

.light-string {
  position: fixed;
  z-index: 20;
  top: 0;
  left: 0;
  width: 100%;
  height: 55px;
  display: flex;
  justify-content: space-around;
  pointer-events: none;
  border-top: 3px solid #533c20;
}

.bulb {
  position: relative;
  width: 13px;
  height: 18px;
  margin-top: 13px;
  border-radius: 50%;
  background: var(--bulb);
  box-shadow: 0 0 8px 3px var(--bulb);
  animation: blink 1.5s infinite alternate;
  animation-delay: var(--delay);
}

.bulb::before {
  content: "";
  position: absolute;
  width: 5px;
  height: 5px;
  background: #888;
  top: -5px;
  left: 4px;
}

@keyframes blink {
  from {
    opacity: .4;
    filter: brightness(.7);
  }
  to {
    opacity: 1;
    filter: brightness(1.8);
  }
}

/* BAKGRUNNSSNØ */

#background-snow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* JULELANDSKAP PÅ SIDENE */

.side-scenery {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.cabin {
  position: absolute;
  bottom: 45px;
  left: 3%;
  font-size: clamp(65px, 10vw, 125px);
  filter: drop-shadow(0 5px 8px #000);
}

.tree {
  position: absolute;
  bottom: 35px;
  font-size: clamp(55px, 8vw, 100px);
  filter: drop-shadow(0 5px 8px #000);
}

.tree-left {
  left: 2%;
}

.tree-left-second {
  left: 13%;
  bottom: 20px;
  font-size: clamp(45px, 6vw, 75px);
}

.tree-right {
  right: 3%;
}

.tree-right-second {
  right: 14%;
  bottom: 20px;
  font-size: clamp(45px, 6vw, 75px);
}

.snow-ground {
  position: absolute;
  bottom: -35px;
  left: -5%;
  width: 110%;
  height: 90px;
  background: linear-gradient(
    to bottom,
    #ffffff 0%,
    #e7f5ff 65%,
    #b7d7e9 100%
  );
  border-radius: 50% 50% 0 0;
  box-shadow: 0 -5px 25px rgba(255,255,255,.3);
}

/* OVERSKRIFT */

h1 {
  position: relative;
  z-index: 2;
  color: var(--gold);
  font-size: clamp(2rem, 6vw, 3.3rem);
  margin: 5px 0 5px;
  letter-spacing: 3px;
  text-shadow:
    0 0 10px rgba(255,215,0,.6),
    0 0 30px rgba(255,165,0,.3);
}

.subtitle {
  position: relative;
  z-index: 2;
  color: #e8f5df;
  margin-bottom: 20px;
  font-size: 1rem;
  letter-spacing: 2px;
}

/* STATISTIKK */

.stats {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  margin: 0 auto 22px;
}

.stat-box {
  min-width: 130px;
  padding: 12px 22px;
  background: linear-gradient(135deg,#174c30,#092619);
  border: 1px solid rgba(255,215,0,.6);
  border-radius: 12px;
  box-shadow: 0 5px 18px rgba(0,0,0,.4);
  font-size: 1.05rem;
  font-weight: bold;
}

.stat-box span {
  color: var(--gold);
  font-size: 1.35rem;
}

/* SPILLEOMRÅDE */

#board-wrapper {
  position: relative;
  z-index: 2;
  width: max-content;
  max-width: 100%;
  margin: auto;
  padding: 15px;
  border-radius: 18px;

  background:
    linear-gradient(145deg,#16472f,#071d16);

  border: 3px solid #b88a31;

  box-shadow:
    0 0 0 4px #3e2913,
    0 0 25px rgba(255,215,0,.22),
    inset 0 0 30px rgba(0,0,0,.7);
}

/* GRANBARD */

.garland {
  position: absolute;
  top: -23px;
  left: 0;
  width: 100%;
  height: 40px;
  z-index: 5;
  pointer-events: none;
  font-size: 27px;
  letter-spacing: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-shadow: 0 2px 5px black;
}

.garland-bottom {
  top: auto;
  bottom: -23px;
}

/* SPILLEBRETT */

#board {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: repeat(12, 42px);
  grid-template-rows: repeat(10, 42px);
  gap: 4px;
}

.tile {
  width: 42px;
  height: 42px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 8px;
  font-size: 24px;
  cursor: pointer;
  user-select: none;
  transition: transform .15s, filter .15s;
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.25),
    0 3px 5px rgba(0,0,0,.4);
}

.tile:hover {
  transform: scale(1.12);
  filter: brightness(1.3);
  z-index: 4;
}

.tile:active {
  transform: scale(.9);
}

.tile.empty {
  background: transparent !important;
  box-shadow: none;
  pointer-events: none;
}

.type-0 { background: linear-gradient(135deg,#ef4444,#991b1b); }
.type-1 { background: linear-gradient(135deg,#34d399,#065f46); }
.type-2 { background: linear-gradient(135deg,#60a5fa,#1e40af); }
.type-3 { background: linear-gradient(135deg,#fbbf24,#b45309); }
.type-4 { background: linear-gradient(135deg,#c084fc,#6b21a8); }

/* SNØ PÅ BRETTET */

#board-snow {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 7;
  pointer-events: none;
}

/* KNAPP */

button {
  position: relative;
  z-index: 2;
  margin-top: 25px;
  padding: 15px 35px;
  border: 2px solid #fff0a0;
  border-radius: 12px;
  color: #361b05;
  font-weight: 900;
  font-size: 1.05rem;
  letter-spacing: 1px;
  cursor: pointer;

  background: linear-gradient(135deg,#ffe66d,#e6a500);

  box-shadow:
    0 5px 20px rgba(255,190,0,.3),
    inset 0 2px 5px white;

  transition: .2s;
}

button:hover {
  transform: scale(1.06);
  box-shadow: 0 0 25px rgba(255,215,0,.6);
}

/* MELDINGER */

#message {
  position: relative;
  z-index: 2;
  margin-top: 18px;
  min-height: 35px;
  font-size: 1.2rem;
  font-weight: bold;
  color: #ffe878;
  text-shadow: 0 0 12px rgba(255,215,0,.4);
}

/* POENG-EFFEKT */

.floating-score {
  position: fixed;
  z-index: 30;
  color: #ffe66d;
  font-size: 28px;
  font-weight: bold;
  pointer-events: none;
  animation: floatUp 1s forwards;
}

@keyframes floatUp {
  from {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  to {
    opacity: 0;
    transform: translateY(-90px) scale(1.5);
  }
}

/* MOBIL */

@media(max-width: 600px) {
  body {
    padding-top: 65px;
  }

  #board {
    grid-template-columns: repeat(12, 27px);
    grid-template-rows: repeat(10, 27px);
    gap: 3px;
  }

  .tile {
    width: 27px;
    height: 27px;
    font-size: 16px;
    border-radius: 5px;
  }

  #board-wrapper {
    padding: 8px;
  }

  .stats {
    gap: 8px;
  }

  .stat-box {
    min-width: 115px;
    padding: 9px 13px;
    font-size: .9rem;
  }

  .cabin {
    left: -12px;
    bottom: 15px;
    font-size: 65px;
  }

  .tree-left {
    left: 2%;
    bottom: 15px;
    font-size: 45px;
  }

  .tree-left-second {
    display: none;
  }

  .tree-right {
    right: 2%;
    bottom: 15px;
    font-size: 45px;
  }

  .tree-right-second {
    display: none;
  }
}

@media(prefers-reduced-motion: reduce) {
  .bulb {
    animation-duration: 0.01ms;
    animation-iteration-count: 1;
  }
}
  
/* =====================================
   KLICКOLAUS – MAGISK JULEVERDEN
===================================== */

/* NORDLYS */

.aurora {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 0%,
      rgba(20, 80, 65, .3), transparent 60%);
}

.aurora::before,
.aurora::after {
  content: "";
  position: absolute;
  width: 160%;
  height: 65%;
  left: -30%;
  top: -20%;
  border-radius: 50%;
  filter: blur(45px);
  opacity: .35;
  mix-blend-mode: screen;
}

.aurora::before {
  background: linear-gradient(
    110deg,
    transparent 15%,
    rgba(0,255,150,.2) 35%,
    rgba(50,255,180,.65) 48%,
    rgba(80,100,255,.25) 65%,
    transparent 85%
  );
  animation: auroraMove 13s ease-in-out infinite alternate;
}

.aurora::after {
  background: linear-gradient(
    100deg,
    transparent 20%,
    rgba(130,50,255,.2) 40%,
    rgba(40,220,180,.45) 55%,
    rgba(40,100,255,.3) 70%,
    transparent 90%
  );
  animation: auroraMove 19s ease-in-out infinite alternate-reverse;
}

@keyframes auroraMove {
  0% {
    transform: translate(-8%, 0) rotate(-8deg) scale(1);
    opacity: .2;
  }
  50% {
    transform: translate(5%, 12%) rotate(5deg) scale(1.2);
    opacity: .55;
  }
  100% {
    transform: translate(12%, -5%) rotate(-4deg) scale(1.1);
    opacity: .3;
  }
}

/* LEVENDE JULEBY */

.christmas-village {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 170px;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.village-sky-glow {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 150px;
  background: linear-gradient(
    to top,
    rgba(160,210,230,.18),
    transparent
  );
}

.village-house {
  position: absolute;
  bottom: 30px;
  width: 85px;
  height: 65px;
  background: #183e36;
  border: 2px solid #9cbab2;
  box-shadow: 0 0 20px rgba(255,210,100,.15);
}

.village-house::before {
  content: "";
  position: absolute;
  width: 65px;
  height: 65px;
  left: 8px;
  top: -35px;
  background: #244e43;
  border-top: 3px solid #dcefff;
  border-left: 3px solid #dcefff;
  transform: rotate(45deg);
  z-index: -1;
}

.village-house::after {
  content: "";
  position: absolute;
  left: 32px;
  bottom: 0;
  width: 18px;
  height: 35px;
  background: #754a2c;
  border-radius: 8px 8px 0 0;
}

.house-window {
  position: absolute;
  width: 17px;
  height: 19px;
  top: 13px;
  background: #ffe78b;
  border: 2px solid #9a713b;
  box-shadow: 0 0 15px 5px rgba(255,210,80,.5);
  animation: windowGlow 3s infinite alternate;
}

.house-window.left { left: 8px; }
.house-window.right { right: 8px; }

@keyframes windowGlow {
  from { opacity: .65; }
  to { opacity: 1; box-shadow: 0 0 22px 8px rgba(255,210,80,.7); }
}

.house-one { left: 5%; transform: scale(.85); }
.house-two { left: 23%; transform: scale(.65); bottom: 15px; }
.house-three { right: 22%; transform: scale(.75); }
.house-four { right: 5%; transform: scale(1.05); }

.village-tree {
  position: absolute;
  bottom: 15px;
  font-size: 65px;
  filter: drop-shadow(0 0 8px rgba(255,255,255,.3));
}

.village-tree.one { left: 15%; }
.village-tree.two { right: 14%; }
.village-tree.three { left: 43%; font-size: 45px; }

/* JULEKALENDER */

#calendar-button {
  display: block;
  margin: 15px auto 20px;
  padding: 13px 25px;
  position: relative;
  z-index: 5;
  border: 2px solid #ffe9a0;
  border-radius: 14px;
  background: linear-gradient(135deg,#a91e27,#65101a);
  color: #fff4c0;
  font-size: 1rem;
  box-shadow: 0 0 20px rgba(255,50,50,.35);
}

#calendar-button:hover {
  transform: scale(1.06);
}

.calendar-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  padding: 15px;
  background: rgba(0,10,8,.88);
  backdrop-filter: blur(8px);
  align-items: center;
  justify-content: center;
  overflow-y: auto;
}

.calendar-modal.active {
  display: flex;
}

.calendar-content {
  position: relative;
  width: min(650px,100%);
  padding: 22px;
  border: 3px solid #d6a844;
  border-radius: 22px;
  background:
    radial-gradient(ellipse at top,#285b40,#092218 75%);
  box-shadow: 0 0 45px rgba(255,215,0,.25);
  max-height: 90vh;
  overflow-y: auto;
}

.calendar-title {
  color: #ffdf72;
  font-size: clamp(1.5rem,5vw,2.2rem);
  text-shadow: 0 0 15px gold;
  margin: 5px 0;
}

.calendar-description {
  color: #e5f5e9;
  margin-bottom: 18px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 9px;
}

.calendar-door {
  min-height: 75px;
  margin: 0;
  padding: 8px 3px;
  border: 2px solid #d4a33b;
  border-radius: 10px;
  background: linear-gradient(145deg,#bd2930,#74151e);
  color: #fff4c4;
  font-size: 1.5rem;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
  box-shadow: inset 0 2px 5px rgba(255,255,255,.2);
}

.calendar-door:hover:not(:disabled) {
  transform: scale(1.07);
  box-shadow: 0 0 18px gold;
}

.calendar-door small {
  display: block;
  font-size: .7rem;
  margin-top: 4px;
}

.calendar-door:disabled {
  opacity: .45;
  cursor: not-allowed;
  filter: grayscale(.5);
}

.calendar-door.opened {
  background: linear-gradient(145deg,#b88b26,#705016);
  border-color: #ffe78b;
}

.calendar-door.claimed {
  background: linear-gradient(145deg,#176b42,#0b3828);
  border-color: #6ce6a0;
}

#calendar-message {
  min-height: 55px;
  margin-top: 16px;
  color: #ffe78b;
  font-weight: bold;
  line-height: 1.5;
}

.calendar-close {
  display: block;
  margin: 15px auto 0;
  padding: 10px 25px;
  font-size: .9rem;
}

/* MAGISK SNØKULE */

#snow-globe-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(1,12,10,.92);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  pointer-events: none;
}

#snow-globe-overlay.active {
  display: flex;
  animation: globeBackground 2.5s forwards;
}

.snow-globe {
  position: relative;
  width: min(270px,70vw);
  aspect-ratio: 1;
  border-radius: 50%;
  border: 9px solid rgba(210,240,255,.8);
  background:
    radial-gradient(circle at 30% 20%,
      rgba(255,255,255,.9),
      rgba(130,200,230,.25) 35%,
      rgba(10,60,70,.85) 85%);
  box-shadow:
    0 0 25px #b8eaff,
    inset 0 0 30px rgba(255,255,255,.6),
    0 0 80px rgba(80,200,255,.4);
  overflow: hidden;
  animation: globeShake 2.5s ease-in-out;
}

.globe-village {
  position: absolute;
  bottom: 35px;
  width: 100%;
  text-align: center;
  font-size: 70px;
  filter: drop-shadow(0 0 10px gold);
}

.globe-snow {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(white 2px,transparent 3px),
    radial-gradient(white 1px,transparent 2px),
    radial-gradient(white 2px,transparent 3px);
  background-size: 35px 35px,23px 23px,50px 50px;
  animation: globeSnow .7s linear infinite;
}

.globe-base {
  width: 210px;
  height: 35px;
  margin-top: -4px;
  border-radius: 10px 10px 35px 35px;
  background: linear-gradient(135deg,#e8c66b,#80521a);
  box-shadow: 0 8px 25px rgba(0,0,0,.5);
}

.globe-text {
  color: #ffe68a;
  font-size: 1.3rem;
  font-weight: bold;
  margin-top: 25px;
  text-shadow: 0 0 15px gold;
}

@keyframes globeShake {
  0% { transform: scale(.2) rotate(-15deg); opacity: 0; }
  15% { transform: scale(1.1) rotate(10deg); opacity: 1; }
  30% { transform: scale(1) rotate(-8deg); }
  45% { transform: scale(1.05) rotate(6deg); }
  60% { transform: scale(1) rotate(-3deg); }
  80% { transform: scale(1) rotate(0); }
  100% { transform: scale(1.3); opacity: 0; }
}

@keyframes globeSnow {
  from { background-position: 0 0,10px 10px,20px 0; }
  to { background-position: 0 100px,10px 80px,20px 120px; }
}

@keyframes globeBackground {
  0%,75% { opacity: 1; }
  100% { opacity: 0; }
}

/* MOBIL */

@media(max-width:600px) {
  .christmas-village {
    height: 110px;
    opacity: .85;
  }

  .village-house {
    transform: scale(.55);
    transform-origin: bottom center;
  }

  .village-tree {
    font-size: 40px;
  }

  .calendar-content {
    padding: 13px;
  }

  .calendar-door {
    min-height: 65px;
    font-size: 1.25rem;
  }

  .calendar-grid {
    gap: 6px;
  }
}

@media(prefers-reduced-motion:reduce) {
  .aurora::before,
  .aurora::after,
  .house-window,
  .globe-snow {
    animation: none !important;
  }
}
</style>
</head>

    <div class="globe-village">
      🏡 🎄 🏠
    </div>

  </div>

  <div class="globe-base"></div>

  <div class="globe-text">
    ✨ MAGISK JULEEVENTYR ✨
  </div>

</div>

<!-- LYDEFFEKT BEHOLDT -->

<audio
  id="minLyd"
  src="Klikk.mp3.mp3"
  preload="auto">
</audio>

<script>

/* JULELYS */

const lights = document.getElementById('lights');

const colors = [
  '#ff3333',
  '#33ff66',
  '#3399ff',
  '#ffff33',
  '#ff55ff'
];

for (let i = 0; i < 28; i++) {
  const bulb = document.createElement('div');
  bulb.className = 'bulb';

  bulb.style.setProperty(
    '--bulb',
    colors[i % colors.length]
  );

  bulb.style.setProperty(
    '--delay',
    (Math.random() * 2) + 's'
  );

  lights.appendChild(bulb);
}

/* SPILLET */

const ROWS = 10;
const COLS = 12;
const ICONS = ['🎅','🎄','🎁','⭐','⛄'];

let grid = [];
let score = 0;
let gameOver = false;
let bonusAwarded = false;

let highScore = Number(
  localStorage.getItem('klickolaus_highscore') || 0
);

document.getElementById('highscore').textContent =
  highScore;


function initGame() {
  score = 0;
  gameOver = false;
  bonusAwarded = false;

  updateScore(0);

  document.getElementById('message').textContent =
    '🎄 Lykke til og god jul! 🎄';

  grid = Array.from({length:ROWS}, () =>
    Array.from({length:COLS}, () =>
      Math.floor(Math.random() * ICONS.length)
    )
  );

  renderBoard();

  // MAGISK SNØKULE
  const globe = document.getElementById('snow-globe-overlay');

  globe.classList.remove('active');

  // Starter animasjonen på nytt
  void globe.offsetWidth;

  globe.classList.add('active');

  setTimeout(() => {
    globe.classList.remove('active');
  }, 2500);
}


function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const val = grid[r][c];
      const tile = document.createElement('div');

      tile.className =
        val === null ? 'tile empty' : 'tile type-' + val;

      tile.textContent =
        val === null ? '' : ICONS[val];

      if (val !== null && !gameOver) {
        tile.onclick = () => handleTileClick(r,c);
      }

      board.appendChild(tile);
    }
  }
}

function findConnected(r,c,target,visited) {
  if (
    r < 0 || r >= ROWS ||
    c < 0 || c >= COLS ||
    visited.has(r + ',' + c) ||
    grid[r][c] !== target
  ) {
    return [];
  }

  visited.add(r + ',' + c);

  return [
    [r,c],
    ...findConnected(r-1,c,target,visited),
    ...findConnected(r+1,c,target,visited),
    ...findConnected(r,c-1,target,visited),
    ...findConnected(r,c+1,target,visited)
  ];
}

function handleTileClick(r,c) {
  if (gameOver) return;

  const type = grid[r][c];
  if (type === null) return;

  const group = findConnected(r,c,type,new Set());

  if (group.length < 2) return;

  // LYDEFFEKT

  const lyd = document.getElementById('minLyd');
  lyd.currentTime = 0;
  lyd.play().catch(() => {});

  const points = Math.pow(group.length - 1,2) * 10;

  showFloatingScore(points);

  group.forEach(([gr,gc]) => {
    grid[gr][gc] = null;
  });

  updateScore(score + points);

  applyGravity();
  shiftColumns();
  renderBoard();
  checkGameOver();
}

function showFloatingScore(points) {
  const popup = document.createElement('div');

  popup.className = 'floating-score';
  popup.textContent = '+' + points + ' ⭐';

  popup.style.left = '50%';
  popup.style.top = '40%';

  document.body.appendChild(popup);

  setTimeout(() => popup.remove(),1000);
}

function applyGravity() {
  for (let c = 0; c < COLS; c++) {
    let emptyRow = ROWS - 1;

    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c] !== null) {
        const temp = grid[r][c];

        grid[r][c] = null;
        grid[emptyRow][c] = temp;

        emptyRow--;
      }
    }
  }
}

function shiftColumns() {
  let writeCol = 0;

  for (let readCol = 0; readCol < COLS; readCol++) {
    if (grid.some(row => row[readCol] !== null)) {
      if (writeCol !== readCol) {
        for (let r = 0; r < ROWS; r++) {
          grid[r][writeCol] = grid[r][readCol];
          grid[r][readCol] = null;
        }
      }

      writeCol++;
    }
  }
}

function checkGameOver() {
  let remaining = 0;
  let possibleMoves = false;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const val = grid[r][c];

      if (val !== null) {
        remaining++;

        if (
          (r + 1 < ROWS && grid[r+1][c] === val) ||
          (c + 1 < COLS && grid[r][c+1] === val)
        ) {
          possibleMoves = true;
        }
      }
    }
  }

  if (remaining === 0 && !bonusAwarded) {
    bonusAwarded = true;
    gameOver = true;

    updateScore(score + 1000);

    document.getElementById('message').textContent =
      '🎉🎅 FANTASTISK! DU TØMTE BRETTET! +1000 BONUSPOENG! 🎁';

    renderBoard();

  } else if (!possibleMoves) {
    gameOver = true;

    document.getElementById('message').textContent =
      '🎅 Spillet er over! ' + remaining +
      ' brikker igjen. Prøv igjen! 🎄';

    renderBoard();
  }
}

function updateScore(newScore) {
  score = newScore;

  document.getElementById('score').textContent = score;

  if (score > highScore) {
    highScore = score;

    localStorage.setItem(
      'klickolaus_highscore',
      highScore
    );

    document.getElementById('highscore').textContent =
      highScore;
  }
}

/* SNØ PÅ SPILLEBRETTET */

const snowCanvas = document.getElementById('board-snow');
const snowCtx = snowCanvas.getContext('2d');
const wrapper = document.getElementById('board-wrapper');

let flakes = [];

function resizeBoardSnow() {
  snowCanvas.width = wrapper.clientWidth;
  snowCanvas.height = wrapper.clientHeight;

  flakes = Array.from({length:100}, () => ({
    x:Math.random() * snowCanvas.width,
    y:Math.random() * snowCanvas.height,
    r:Math.random() * 2 + .5,
    speed:Math.random() * .8 + .3,
    alpha:Math.random() * .7 + .2
  }));
}

function animateBoardSnow() {
  snowCtx.clearRect(0,0,snowCanvas.width,snowCanvas.height);

  flakes.forEach(f => {
    snowCtx.beginPath();
    snowCtx.arc(f.x,f.y,f.r,0,Math.PI * 2);

    snowCtx.fillStyle =
      `rgba(255,255,255,${f.alpha})`;

    snowCtx.fill();

    f.y += f.speed;

    if (f.y > snowCanvas.height) {
      f.y = -5;
      f.x = Math.random() * snowCanvas.width;
    }
  });

  requestAnimationFrame(animateBoardSnow);
}

/* SNØ I BAKGRUNNEN */

const bgCanvas = document.getElementById('background-snow');
const bgCtx = bgCanvas.getContext('2d');

let backgroundFlakes = [];

function resizeBackgroundSnow() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;

  backgroundFlakes = Array.from({length:120}, () => ({
    x:Math.random() * bgCanvas.width,
    y:Math.random() * bgCanvas.height,
    r:Math.random() * 2.5 + .5,
    speed:Math.random() * 1.2 + .3
  }));
}

function animateBackgroundSnow() {
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);

  backgroundFlakes.forEach(f => {
    bgCtx.beginPath();
    bgCtx.arc(f.x,f.y,f.r,0,Math.PI * 2);
    bgCtx.fillStyle = 'rgba(255,255,255,.8)';
    bgCtx.fill();

    f.y += f.speed;

    if (f.y > bgCanvas.height) {
      f.y = -5;
      f.x = Math.random() * bgCanvas.width;
    }
  });

  requestAnimationFrame(animateBackgroundSnow);
}

window.addEventListener('resize', () => {
  resizeBackgroundSnow();
  resizeBoardSnow();
});

resizeBackgroundSnow();
resizeBoardSnow();

animateBackgroundSnow();
animateBoardSnow();

initGame();

  
/* =====================================
   MAGISK JULEKALENDER
===================================== */

const CALENDAR_YEAR = 2026;

// Sett til true hvis du vil teste kalenderen
// før desember. Da blir alle lukene tilgjengelige.
const CALENDAR_TEST_MODE = false;

function getCalendarDate() {
  return new Date();
}

function getCalendarKey(day) {
  return 'klickolaus_calendar_' +
    CALENDAR_YEAR + '_' + day;
}

function isDoorUnlocked(day) {
  if (CALENDAR_TEST_MODE) return true;

  const now = getCalendarDate();

  return (
    now.getFullYear() === CALENDAR_YEAR &&
    now.getMonth() === 11 &&
    day <= now.getDate()
  );
}

/* ÅPNE KALENDER */

function openCalendar() {
  document.getElementById('calendar-modal')
    .classList.add('active');

  renderCalendar();
}

function closeCalendar() {
  document.getElementById('calendar-modal')
    .classList.remove('active');
}

/* BYGG DE 24 LUKENE */

function renderCalendar() {
  const calendar = document.getElementById('calendar-grid');
  const message = document.getElementById('calendar-message');

  calendar.innerHTML = '';

  const now = getCalendarDate();

  if (!CALENDAR_TEST_MODE &&
      (now.getFullYear() !== CALENDAR_YEAR ||
       now.getMonth() !== 11)) {

    if (now.getFullYear() < CALENDAR_YEAR ||
        (now.getFullYear() === CALENDAR_YEAR &&
         now.getMonth() < 11)) {

      message.textContent =
        '🎅 Julekalenderen åpner 1. desember ' +
        CALENDAR_YEAR + '! 🎁';

    } else {
      message.textContent =
        '🎄 Takk for en magisk jul! Kalenderen åpner igjen neste desember. ❤️';
    }
  } else {
    message.textContent =
      '✨ Velg en av dagens tilgjengelige luker! ✨';
  }

  for (let day = 1; day <= 24; day++) {

    const door = document.createElement('button');

    door.className = 'calendar-door';

    const claimed = localStorage.getItem(
      getCalendarKey(day)
    );

    const unlocked = isDoorUnlocked(day);

    door.innerHTML =
      claimed
        ? '🎁<small>' + day + ' · Åpnet</small>'
        : unlocked
          ? '🎄<small>' + day + '</small>'
          : '🔒<small>' + day + '</small>';

    if (claimed) {
      door.classList.add('claimed');
    } else if (unlocked) {
      door.classList.add('opened');
    }

    door.disabled = !unlocked || !!claimed;

    door.onclick = () => openCalendarDoor(day);

    calendar.appendChild(door);
  }
}

/* ÅPNE EN LUKE */

function openCalendarDoor(day) {

  if (!isDoorUnlocked(day)) {
    return;
  }

  const key = getCalendarKey(day);

  if (localStorage.getItem(key)) {
    return;
  }

  // Registrer at dagens luke er åpnet
  localStorage.setItem(key, 'true');

  const message = document.getElementById('calendar-message');

  /* FORSKJELLIGE OVERRASKELSER */

  if (day === 24) {

    updateScore(score + 1000);

    message.innerHTML =
      '🎅🎄 GOD JUL! 🎄🎅<br>' +
      'Du fant den store julegaven!<br>' +
      '⭐ +1000 BONUSPOENG!';

  } else if (day % 3 === 0) {

    startChristmasChallenge(day);

  } else if (day % 3 === 1) {

    const bonus = day * 25 + 100;

    updateScore(score + bonus);

    message.innerHTML =
      '🎁 DU FANT EN MAGISK JULEGAVE!<br>' +
      '⭐ +' + bonus + ' BONUSPOENG!';

  } else {

    updateScore(score + 150);

    message.innerHTML =
      '✨ NISSENS HEMMELIGE OVERRASKELSE!<br>' +
      '🎄 +150 POENG OG ET NYTT MAGISK BRETT!';

    startChristmasChallenge(day);
  }

  renderCalendar();
}

/* ALTERNATIVE SPILLNIVÅER */

function startChristmasChallenge(day) {

  score += 0;
  gameOver = false;
  bonusAwarded = false;

  // Et spesielt utfordringsbrett
  // med bare to forskjellige brikketyper.
  const firstType = day % ICONS.length;
  const secondType = (day + 2) % ICONS.length;

  grid = Array.from({length:ROWS}, () =>
    Array.from({length:COLS}, () =>
      Math.random() < 0.5 ? firstType : secondType
    )
  );

  renderBoard();

  document.getElementById('message').textContent =
    '❄️ JULEUTFORDRING! LUKE ' + day +
    ' – TØM DET MAGISKE BRETTET! 🎄';
}

/* KALENDERKNAPPENS DATO */

function updateCalendarButton() {

  const button = document.getElementById('calendar-button');

  if (CALENDAR_TEST_MODE) {
    button.textContent = '🎁 JULEKALENDER – TESTMODUS 🎄';
    return;
  }

  const now = getCalendarDate();

  if (now.getFullYear() === CALENDAR_YEAR &&
      now.getMonth() === 11) {

    button.textContent =
      '🎁 JULEKALENDER – DAG ' +
      Math.min(now.getDate(),24) + ' 🎄';

  } else if (
    now.getFullYear() < CALENDAR_YEAR ||
    (now.getFullYear() === CALENDAR_YEAR &&
     now.getMonth() < 11)
  ) {

    button.textContent =
      '🎁 JULEKALENDER – ÅPNER 1. DESEMBER 🎄';

  } else {

    button.textContent =
      '🎁 JULEKALENDER – GOD JUL! 🎄';
  }
}

updateCalendarButton();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klickolaus – Familiespill</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a3a2a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #ffd700; margin-bottom: 5px; }
    .stats {
      display: flex;
      gap: 20px;
      font-size: 1.2rem;
      margin-bottom: 15px;
      background: #244f3a;
      padding: 10px 20px;
      border-radius: 8px;
      border: 2px solid #ffd700;
    }
    #board-wrapper {
      position: relative;
      padding: 10px;
      border-radius: 10px;
      background: radial-gradient(circle at top, #102a38 0%, #07131a 70%, #03080b 100%);
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.8), 0 6px 20px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }
    #board-snow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    #board {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(12, 42px);
      grid-template-rows: repeat(10, 42px);
      gap: 4px;
    }
    .tile {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease;
    }
    .tile:hover {
      transform: scale(1.06);
    }
    .tile.empty { background-color: transparent !important; pointer-events: none; }
    .type-0 { background-color: #c0392b; }
    .type-1 { background-color: #27ae60; }
    .type-2 { background-color: #2980b9; }
    .type-3 { background-color: #f39c12; }
    .type-4 { background-color: #8e44ad; }
    button {
      margin-top: 15px;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      color: #1a3a2a;
      background-color: #ffd700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #message { margin-top: 12px; font-size: 1.2rem; font-weight: bold; color: #ffea70; height: 28px; }
  </style>
</head>
<body>
  <h1>🎅 Klickolaus 🎄</h1>
  <div class="stats">
    <div>Poeng: <span id="score">0</span></div>
    <div>Rekord: <span id="highscore">0</span></div>
  </div>

  <div id="board-wrapper">
    <canvas id="board-snow"></canvas>
    <div id="board"></div>
  </div>

  <div id="message"></div>
  <button onclick="initGame()">Nytt spill</button>

  <audio id="minLyd" src="Klikk.mp3.mp3" preload="auto"></audio>

  <script>
    const ROWS = 10, COLS = 12;
    const ICONS = ['🎅', '🎄', '🎁', '⭐', '⛄'];
    let grid = [], score = 0;
    let highScore = localStorage.getItem('klickolaus_highscore') || 0;
    document.getElementById('highscore').textContent = highScore;

    function initGame() {
      score = 0;
      updateScore(0);
      document.getElementById('message').textContent = '';
      grid = Array.from({ length: ROWS }, () =>
        Array.from({ length: COLS }, () => Math.floor(Math.random() * ICONS.length))
      );
      renderBoard();
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const val = grid[r][c];
          const tile = document.createElement('div');
          tile.className = val === null ? 'tile empty' : 'tile type-' + val;
          tile.textContent = val === null ? '' : ICONS[val];
          if (val !== null) tile.onclick = () => handleTileClick(r, c);
          board.appendChild(tile);
        }
      }
    }

    function findConnected(r, c, target, visited) {
      const key = r + ',' + c;
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS || visited.has(key) || grid[r][c] !== target) return [];
      visited.add(key);
      return [
        [r, c],
        ...findConnected(r - 1, c, target, visited),
        ...findConnected(r + 1, c, target, visited),
        ...findConnected(r, c - 1, target, visited),
        ...findConnected(r, c + 1, target, visited)
      ];
    }

    function handleTileClick(r, c) {
      const type = grid[r][c];
      if (type === null) return;
      const group = findConnected(r, c, type, new Set());
      if (group.length < 2) return;

      const lyd = document.getElementById('minLyd');
      lyd.currentTime = 0;
      lyd.play().catch(() => {});

      group.forEach(([gr, gc]) => { grid[gr][gc] = null; });
      updateScore(score + Math.pow(group.length - 1, 2) * 10);
      applyGravity();
      shiftColumns();
      renderBoard();
      checkGameOver();
    }

    function applyGravity() {
      for (let c = 0; c < COLS; c++) {
        let emptyRow = ROWS - 1;
        for (let r = ROWS - 1; r >= 0; r--) {
          if (grid[r][c] !== null) {
            const temp = grid[r][c];
            grid[r][c] = null;
            grid[emptyRow][c] = temp;
            emptyRow--;
          }
        }
      }
    }

    function shiftColumns() {
      let writeCol = 0;
      for (let readCol = 0; readCol < COLS; readCol++) {
        if (grid.some(row => row[readCol] !== null)) {
          if (writeCol !== readCol) {
            for (let r = 0; r < ROWS; r++) {
              grid[r][writeCol] = grid[r][readCol];
              grid[r][readCol] = null;
            }
          }
          writeCol++;
        }
      }
    }

    function checkGameOver() {
      let remaining = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const val = grid[r][c];
          if (val !== null) {
            remaining++;
            if ((r + 1 < ROWS && grid[r + 1][c] === val) || (c + 1 < COLS && grid[r][c + 1] === val)) return;
          }
        }
      }
      if (remaining === 0) {
        updateScore(score + 1000);
        document.getElementById('message').textContent = '🎉 Brettet er tømt! +1000 bonuspoeng!';
      } else {
        document.getElementById('message').textContent = 'Spillet er over! (' + remaining + ' brikker igjen)';
      }
    }

    function updateScore(newScore) {
      score = newScore;
      document.getElementById('score').textContent = score;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('klickolaus_highscore', highScore);
        document.getElementById('highscore').textContent = highScore;
      }
    }

    // --- LEVENDE SNØFALL INNE I SPILLEBRETTET ---
    const snowCanvas = document.getElementById('board-snow');
    const snowCtx = snowCanvas.getContext('2d');
    const wrapper = document.getElementById('board-wrapper');
    snowCanvas.width = wrapper.offsetWidth;
    snowCanvas.height = wrapper.offsetHeight;

    const flakes = Array.from({ length: 55 }, () => ({
      x: Math.random() * snowCanvas.width,
      y: Math.random() * snowCanvas.height,
      r: Math.random() * 2.2 + 0.7,
      speedY: Math.random() * 0.6 + 0.25,
      speedX: Math.random() * 0.3 - 0.15,
      alpha: Math.random() * 0.65 + 0.2
    }));

    function animateBoardSnow() {
      snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
      flakes.forEach(f => {
        snowCtx.beginPath();
        snowCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        snowCtx.fillStyle = `rgba(255, 255, 255, ${f.alpha})`;
        snowCtx.fill();

        f.y += f.speedY;
        f.x += f.speedX;
        if (f.y > snowCanvas.height) { f.y = -4; f.x = Math.random() * snowCanvas.width; }
        if (f.x > snowCanvas.width) f.x = 0;
        if (f.x < 0) f.x = snowCanvas.width;
      });
      requestAnimationFrame(animateBoardSnow);
    }
    animateBoardSnow();

    initGame();
  </script>
</body>
</html>

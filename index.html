
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klickolaus – Det magiske julespillet</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --gold: #ffd700;
  --red: #c62828;
  --green: #146b3a;
  --dark: #071912;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 65px 12px 35px;
  font-family: 'Segoe UI', sans-serif;
  color: white;
  text-align: center;
  overflow-x: hidden;

  background:
    radial-gradient(ellipse at 50% 0%, #28543c 0%, transparent 48%),
    radial-gradient(ellipse at bottom, #143d28 0%, #06150f 75%);
}

/* JULELYS */

.light-string {
  position: fixed;
  z-index: 20;
  top: 0;
  left: 0;
  width: 100%;
  height: 55px;
  display: flex;
  justify-content: space-around;
  pointer-events: none;
  border-top: 3px solid #533c20;
}

.bulb {
  position: relative;
  width: 13px;
  height: 18px;
  margin-top: 13px;
  border-radius: 50%;
  background: var(--bulb);
  box-shadow: 0 0 8px 3px var(--bulb);
  animation: blink 1.5s infinite alternate;
  animation-delay: var(--delay);
}

.bulb::before {
  content: "";
  position: absolute;
  width: 5px;
  height: 5px;
  background: #888;
  top: -5px;
  left: 4px;
}

@keyframes blink {
  from {
    opacity: .4;
    filter: brightness(.7);
  }
  to {
    opacity: 1;
    filter: brightness(1.8);
  }
}

/* BAKGRUNNSSNØ */

#background-snow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* OVERSKRIFT */

h1 {
  position: relative;
  z-index: 2;
  color: var(--gold);
  font-size: clamp(2rem, 6vw, 3.3rem);
  margin: 5px 0 5px;
  letter-spacing: 3px;
  text-shadow:
    0 0 10px rgba(255,215,0,.6),
    0 0 30px rgba(255,165,0,.3);
}

.subtitle {
  color: #e8f5df;
  margin-bottom: 20px;
  font-size: 1rem;
  letter-spacing: 2px;
}

/* STATISTIKK */

.stats {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  margin: 0 auto 22px;
}

.stat-box {
  min-width: 130px;
  padding: 12px 22px;
  background: linear-gradient(135deg,#174c30,#092619);
  border: 1px solid rgba(255,215,0,.6);
  border-radius: 12px;
  box-shadow: 0 5px 18px rgba(0,0,0,.4);
  font-size: 1.05rem;
  font-weight: bold;
}

.stat-box span {
  color: var(--gold);
  font-size: 1.35rem;
}

/* SPILLEOMRÅDE */

#board-wrapper {
  position: relative;
  z-index: 2;
  width: max-content;
  max-width: 100%;
  margin: auto;
  padding: 15px;
  border-radius: 18px;

  background:
    linear-gradient(145deg,#16472f,#071d16);

  border: 3px solid #b88a31;

  box-shadow:
    0 0 0 4px #3e2913,
    0 0 25px rgba(255,215,0,.22),
    inset 0 0 30px rgba(0,0,0,.7);
}

/* GRANBARD */

.garland {
  position: absolute;
  top: -23px;
  left: 0;
  width: 100%;
  height: 40px;
  z-index: 5;
  pointer-events: none;
  font-size: 27px;
  letter-spacing: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-shadow: 0 2px 5px black;
}

.garland-bottom {
  top: auto;
  bottom: -23px;
}

/* NISSE OG SLEDE */

#santa {
  position: absolute;
  width: 310px;
  height: auto;
  top: 45px;
  left: -340px;
  z-index: 6;
  pointer-events: none;
  filter: drop-shadow(0 0 12px rgba(255,215,0,.65));
  animation: santaFlight 19s linear infinite;
}

@keyframes santaFlight {
  0% {
    transform: translateX(0) translateY(0) rotate(-3deg);
  }
  25% {
    transform: translateX(35vw) translateY(-20px) rotate(2deg);
  }
  50% {
    transform: translateX(75vw) translateY(5px) rotate(-1deg);
  }
  75% {
    transform: translateX(110vw) translateY(-15px) rotate(2deg);
  }
  100% {
    transform: translateX(150vw) translateY(0) rotate(-2deg);
  }
}

/* SPILLEBRETT */

#board {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: repeat(12, 42px);
  grid-template-rows: repeat(10, 42px);
  gap: 4px;
}

.tile {
  width: 42px;
  height: 42px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 8px;
  font-size: 24px;
  cursor: pointer;
  user-select: none;
  transition: transform .15s, filter .15s;
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.25),
    0 3px 5px rgba(0,0,0,.4);
}

.tile:hover {
  transform: scale(1.12);
  filter: brightness(1.3);
  z-index: 4;
}

.tile:active {
  transform: scale(.9);
}

.tile.empty {
  background: transparent !important;
  box-shadow: none;
  pointer-events: none;
}

.type-0 { background: linear-gradient(135deg,#ef4444,#991b1b); }
.type-1 { background: linear-gradient(135deg,#34d399,#065f46); }
.type-2 { background: linear-gradient(135deg,#60a5fa,#1e40af); }
.type-3 { background: linear-gradient(135deg,#fbbf24,#b45309); }
.type-4 { background: linear-gradient(135deg,#c084fc,#6b21a8); }

/* SNØ PÅ BRETTET */

#board-snow {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 7;
  pointer-events: none;
}

/* KNAPP */

button {
  position: relative;
  z-index: 2;
  margin-top: 25px;
  padding: 15px 35px;
  border: 2px solid #fff0a0;
  border-radius: 12px;
  color: #361b05;
  font-weight: 900;
  font-size: 1.05rem;
  letter-spacing: 1px;
  cursor: pointer;

  background: linear-gradient(135deg,#ffe66d,#e6a500);

  box-shadow:
    0 5px 20px rgba(255,190,0,.3),
    inset 0 2px 5px white;

  transition: .2s;
}

button:hover {
  transform: scale(1.06);
  box-shadow: 0 0 25px rgba(255,215,0,.6);
}

/* MELDINGER */

#message {
  position: relative;
  z-index: 2;
  margin-top: 18px;
  min-height: 35px;
  font-size: 1.2rem;
  font-weight: bold;
  color: #ffe878;
  text-shadow: 0 0 12px rgba(255,215,0,.4);
}

/* POENG-EFFEKT */

.floating-score {
  position: fixed;
  z-index: 30;
  color: #ffe66d;
  font-size: 28px;
  font-weight: bold;
  pointer-events: none;
  animation: floatUp 1s forwards;
}

@keyframes floatUp {
  from {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  to {
    opacity: 0;
    transform: translateY(-90px) scale(1.5);
  }
}

/* MOBIL */

@media(max-width: 600px) {
  body {
    padding-top: 65px;
  }

  #board {
    grid-template-columns: repeat(12, 27px);
    grid-template-rows: repeat(10, 27px);
    gap: 3px;
  }

  .tile {
    width: 27px;
    height: 27px;
    font-size: 16px;
    border-radius: 5px;
  }

  #board-wrapper {
    padding: 8px;
  }

  .stats {
    gap: 8px;
  }

  .stat-box {
    min-width: 115px;
    padding: 9px 13px;
    font-size: .9rem;
  }

  #santa {
    width: 210px;
  }
}

@media(prefers-reduced-motion: reduce) {
  .bulb, #santa {
    animation-duration: 0.01ms;
    animation-iteration-count: 1;
  }
}
</style>
</head>

<body>

<canvas id="background-snow"></canvas>

<!-- JULELYS -->
<div class="light-string" id="lights"></div>

<h1>🎅 KLICКOLAUS 🎄</h1>
<div class="subtitle">✨ DET MAGISKE JULESPILLET ✨</div>

<div class="stats">
  <div class="stat-box">
    🎁 Poeng<br>
    <span id="score">0</span>
  </div>

  <div class="stat-box">
    🏆 Rekord<br>
    <span id="highscore">0</span>
  </div>
</div>

<div id="board-wrapper">

  <div class="garland">
    🎄 ✨ 🎄 🎀 🎄 ✨ 🎄 🎀 🎄
  </div>

  <!-- NISSE OG SLEDE -->
  <img
    id="santa"
    src="https://images.unsplash.com/photo-1543589077-47d81606c1bf?w=700"
    alt="Julenisse og julemotiv"
  >

  <canvas id="board-snow"></canvas>

  <div id="board"></div>

  <div class="garland garland-bottom">
    🎄 🎀 🎄 ✨ 🎄 🎀 🎄 ✨ 🎄
  </div>

</div>

<div id="message">
  🎄 Lykke til og god jul! 🎄
</div>

<button onclick="initGame()">
  🎅 NYTT SPILL 🎅
</button>

<!-- BEHOLDT LYDEFFEKT -->
<audio
  id="minLyd"
  src="Klikk.mp3.mp3"
  preload="auto">
</audio>

<script>
/* JULELYS */

const lights = document.getElementById('lights');

const colors = [
  '#ff3333',
  '#33ff66',
  '#3399ff',
  '#ffff33',
  '#ff55ff'
];

for (let i = 0; i < 28; i++) {
  const bulb = document.createElement('div');
  bulb.className = 'bulb';

  bulb.style.setProperty(
    '--bulb',
    colors[i % colors.length]
  );

  bulb.style.setProperty(
    '--delay',
    (Math.random() * 2) + 's'
  );

  lights.appendChild(bulb);
}

/* SPILLET */

const ROWS = 10;
const COLS = 12;
const ICONS = ['🎅','🎄','🎁','⭐','⛄'];

let grid = [];
let score = 0;
let gameOver = false;
let bonusAwarded = false;

let highScore = Number(
  localStorage.getItem('klickolaus_highscore') || 0
);

document.getElementById('highscore').textContent =
  highScore;

function initGame() {
  score = 0;
  gameOver = false;
  bonusAwarded = false;

  updateScore(0);

  document.getElementById('message').textContent =
    '🎄 Lykke til og god jul! 🎄';

  grid = Array.from({length:ROWS}, () =>
    Array.from({length:COLS}, () =>
      Math.floor(Math.random() * ICONS.length)
    )
  );

  renderBoard();
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const val = grid[r][c];
      const tile = document.createElement('div');

      tile.className =
        val === null ? 'tile empty' : 'tile type-' + val;

      tile.textContent =
        val === null ? '' : ICONS[val];

      if (val !== null && !gameOver) {
        tile.onclick = () => handleTileClick(r,c);
      }

      board.appendChild(tile);
    }
  }
}

function findConnected(r,c,target,visited) {
  if (
    r < 0 || r >= ROWS ||
    c < 0 || c >= COLS ||
    visited.has(r + ',' + c) ||
    grid[r][c] !== target
  ) {
    return [];
  }

  visited.add(r + ',' + c);

  return [
    [r,c],
    ...findConnected(r-1,c,target,visited),
    ...findConnected(r+1,c,target,visited),
    ...findConnected(r,c-1,target,visited),
    ...findConnected(r,c+1,target,visited)
  ];
}

function handleTileClick(r,c) {
  if (gameOver) return;

  const type = grid[r][c];
  if (type === null) return;

  const group = findConnected(r,c,type,new Set());

  if (group.length < 2) return;

  // LYDEFFEKTEN ER BEHOLDT
  const lyd = document.getElementById('minLyd');
  lyd.currentTime = 0;
  lyd.play().catch(() => {});

  const points = Math.pow(group.length - 1,2) * 10;

  showFloatingScore(points);

  group.forEach(([gr,gc]) => {
    grid[gr][gc] = null;
  });

  updateScore(score + points);

  applyGravity();
  shiftColumns();
  renderBoard();
  checkGameOver();
}

function showFloatingScore(points) {
  const popup = document.createElement('div');

  popup.className = 'floating-score';
  popup.textContent = '+' + points + ' ⭐';

  popup.style.left = '50%';
  popup.style.top = '40%';

  document.body.appendChild(popup);

  setTimeout(() => popup.remove(),1000);
}

function applyGravity() {
  for (let c = 0; c < COLS; c++) {
    let emptyRow = ROWS - 1;

    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c] !== null) {
        const temp = grid[r][c];

        grid[r][c] = null;
        grid[emptyRow][c] = temp;

        emptyRow--;
      }
    }
  }
}

function shiftColumns() {
  let writeCol = 0;

  for (let readCol = 0; readCol < COLS; readCol++) {
    if (grid.some(row => row[readCol] !== null)) {
      if (writeCol !== readCol) {
        for (let r = 0; r < ROWS; r++) {
          grid[r][writeCol] = grid[r][readCol];
          grid[r][readCol] = null;
        }
      }

      writeCol++;
    }
  }
}

function checkGameOver() {
  let remaining = 0;
  let possibleMoves = false;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const val = grid[r][c];

      if (val !== null) {
        remaining++;

        if (
          (r + 1 < ROWS && grid[r+1][c] === val) ||
          (c + 1 < COLS && grid[r][c+1] === val)
        ) {
          possibleMoves = true;
        }
      }
    }
  }

  if (remaining === 0 && !bonusAwarded) {
    bonusAwarded = true;
    gameOver = true;

    updateScore(score + 1000);

    document.getElementById('message').textContent =
      '🎉🎅 FANTASTISK! DU TØMTE BRETTET! +1000 BONUSPOENG! 🎁';

    renderBoard();

  } else if (!possibleMoves) {
    gameOver = true;

    document.getElementById('message').textContent =
      '🎅 Spillet er over! ' + remaining +
      ' brikker igjen. Prøv igjen! 🎄';

    renderBoard();
  }
}

function updateScore(newScore) {
  score = newScore;

  document.getElementById('score').textContent = score;

  if (score > highScore) {
    highScore = score;

    localStorage.setItem(
      'klickolaus_highscore',
      highScore
    );

    document.getElementById('highscore').textContent =
      highScore;
  }
}

/* SNØ PÅ SPILLEBRETTET */

const snowCanvas = document.getElementById('board-snow');
const snowCtx = snowCanvas.getContext('2d');
const wrapper = document.getElementById('board-wrapper');

let flakes = [];

function resizeBoardSnow() {
  snowCanvas.width = wrapper.clientWidth;
  snowCanvas.height = wrapper.clientHeight;

  flakes = Array.from({length:100}, () => ({
    x:Math.random() * snowCanvas.width,
    y:Math.random() * snowCanvas.height,
    r:Math.random() * 2 + .5,
    speed:Math.random() * .8 + .3,
    alpha:Math.random() * .7 + .2
  }));
}

function animateBoardSnow() {
  snowCtx.clearRect(0,0,snowCanvas.width,snowCanvas.height);

  flakes.forEach(f => {
    snowCtx.beginPath();
    snowCtx.arc(f.x,f.y,f.r,0,Math.PI * 2);

    snowCtx.fillStyle =
      `rgba(255,255,255,${f.alpha})`;

    snowCtx.fill();

    f.y += f.speed;

    if (f.y > snowCanvas.height) {
      f.y = -5;
      f.x = Math.random() * snowCanvas.width;
    }
  });

  requestAnimationFrame(animateBoardSnow);
}

/* SNØ I BAKGRUNNEN */

const bgCanvas = document.getElementById('background-snow');
const bgCtx = bgCanvas.getContext('2d');

let backgroundFlakes = [];

function resizeBackgroundSnow() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;

  backgroundFlakes = Array.from({length:120}, () => ({
    x:Math.random() * bgCanvas.width,
    y:Math.random() * bgCanvas.height,
    r:Math.random() * 2.5 + .5,
    speed:Math.random() * 1.2 + .3
  }));
}

function animateBackgroundSnow() {
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);

  backgroundFlakes.forEach(f => {
    bgCtx.beginPath();
    bgCtx.arc(f.x,f.y,f.r,0,Math.PI * 2);
    bgCtx.fillStyle = 'rgba(255,255,255,.8)';
    bgCtx.fill();

    f.y += f.speed;

    if (f.y > bgCanvas.height) {
      f.y = -5;
      f.x = Math.random() * bgCanvas.width;
    }
  });

  requestAnimationFrame(animateBackgroundSnow);
}

window.addEventListener('resize', () => {
  resizeBackgroundSnow();
  resizeBoardSnow();
});

resizeBackgroundSnow();
resizeBoardSnow();

animateBackgroundSnow();
animateBoardSnow();

initGame();

</script>
</body>
</html>
